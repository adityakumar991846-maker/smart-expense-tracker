<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/auth.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="/frontend/login.html" class="auth-brand">
        <i class="bi bi-wallet2"></i>
        <span>Smart Expense</span>
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage and track your daily spending</p>

      <div id="loginAlert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-medium">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label fw-medium mb-0">Password</label>
            <a href="#" class="small text-decoration-none text-muted" onclick="alert('Password reset link will be sent to your registered email in a future update.'); return false;">Forgot password?</a>
          </div>
          <div class="input-group mt-2">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 mt-2">
          Sign In
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p class="text-center mb-0 small text-muted">
        Don't have an account yet?
        <a href="/frontend/register.html" class="fw-semibold text-primary text-decoration-none">Create an account</a>
      </p>
    </div>
  </div>

  <script src="/frontend/js/config.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/common.js"></script>
  <script src="/frontend/js/login.js"></script>
</body>
</html>
