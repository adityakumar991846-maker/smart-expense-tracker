<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Smart Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <a href="/frontend/dashboard.html" class="sidebar-brand">
        <i class="bi bi-wallet2 me-2"></i>
        <span>Smart Expense</span>
      </a>

      <nav class="sidebar-menu">
        <a href="/frontend/dashboard.html" class="sidebar-nav-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
        <a href="/frontend/expenses.html" class="sidebar-nav-link">
          <i class="bi bi-receipt"></i>
          <span>Expenses</span>
        </a>
        <a href="/frontend/add-expense.html" class="sidebar-nav-link">
          <i class="bi bi-plus-circle"></i>
          <span>Add Expense</span>
        </a>
        <a href="/frontend/scan-payment.html" class="sidebar-nav-link">
          <i class="bi bi-qr-code-scan"></i>
          <span>Scan Payment</span>
        </a>
        <a href="/frontend/reports.html" class="sidebar-nav-link">
          <i class="bi bi-bar-chart-line"></i>
          <span>Reports</span>
        </a>
        <a href="/frontend/profile.html" class="sidebar-nav-link active">
          <i class="bi bi-person-circle"></i>
          <span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
          <div class="overflow-hidden me-2">
            <div class="fw-semibold small text-truncate user-display-name">User</div>
            <div class="text-muted smaller text-truncate user-display-email" style="font-size: 0.75rem;">user@example.com</div>
          </div>
          <button class="btn btn-sm btn-outline-danger btn-logout" title="Sign Out">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Content Area -->
    <main class="app-main">
      <header class="app-navbar">
        <div class="d-flex align-items-center">
          <button class="btn btn-sm btn-outline-secondary d-lg-none me-2" id="sidebarToggle" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h5 class="mb-0 fw-bold">User Profile & Settings</h5>
        </div>
      </header>

      <div class="app-content">
        <div class="row g-4">
          <!-- Profile & Budget Card -->
          <div class="col-12 col-lg-6">
            <div class="app-card p-4 h-100">
              <h6 class="fw-bold mb-3">Account Details & Budget</h6>
              <div id="profileAlert"></div>

              <form id="profileForm">
                <div class="mb-3">
                  <label class="form-label text-muted small mb-1">Email Address</label>
                  <input type="email" id="profileEmail" class="form-control bg-light" readonly disabled>
                </div>

                <div class="mb-3">
                  <label for="profileFullName" class="form-label fw-medium small mb-1">Full Name</label>
                  <input type="text" id="profileFullName" class="form-control" required>
                </div>

                <div class="mb-3">
                  <label for="profileBudget" class="form-label fw-medium small mb-1">Monthly Spending Budget (₹)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">₹</span>
                    <input type="number" step="100" min="0" id="profileBudget" class="form-control" placeholder="10000">
                  </div>
                  <div class="form-text">Set your monthly limit to receive 80% threshold warnings on the dashboard.</div>
                </div>

                <button type="submit" id="saveProfileBtn" class="btn btn-primary btn-sm px-3 mt-2">
                  Update Profile
                </button>
              </form>
            </div>
          </div>

          <!-- Password Change Card -->
          <div class="col-12 col-lg-6">
            <div class="app-card p-4 h-100">
              <h6 class="fw-bold mb-3">Change Password</h6>
              <div id="passwordAlert"></div>

              <form id="passwordForm">
                <div class="mb-3">
                  <label for="oldPassword" class="form-label fw-medium small mb-1">Current Password</label>
                  <input type="password" id="oldPassword" class="form-control" required>
                </div>

                <div class="mb-3">
                  <label for="newPassword" class="form-label fw-medium small mb-1">New Password</label>
                  <input type="password" id="newPassword" class="form-control" minlength="6" required>
                </div>

                <div class="mb-3">
                  <label for="confirmNewPassword" class="form-label fw-medium small mb-1">Confirm New Password</label>
                  <input type="password" id="confirmNewPassword" class="form-control" minlength="6" required>
                </div>

                <button type="submit" id="changePasswordBtn" class="btn btn-outline-primary btn-sm px-3 mt-2">
                  Change Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/deploy-config.js"></script>
  <script src="/frontend/js/config.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth()) return;

      const profileEmail = document.getElementById('profileEmail');
      const profileFullName = document.getElementById('profileFullName');
      const profileBudget = document.getElementById('profileBudget');
      const profileForm = document.getElementById('profileForm');
      const passwordForm = document.getElementById('passwordForm');

      // Fetch user profile from API
      try {
        const res = await API.get(CONFIG.ENDPOINTS.PROFILE);
        if (res.ok && res.data.user) {
          const user = res.data.user;
          profileEmail.value = user.email;
          profileFullName.value = user.full_name || '';
          profileBudget.value = user.monthly_budget || 0;
          API.setAuth(null, user);
        }
      } catch (e) {
        console.error('Failed to load profile:', e);
      }

      // Save profile updates
      profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        Common.clearAlert('profileAlert');

        const btn = document.getElementById('saveProfileBtn');
        btn.disabled = true;

        try {
          const res = await API.put(CONFIG.ENDPOINTS.PROFILE, {
            full_name: profileFullName.value.trim(),
            monthly_budget: parseFloat(profileBudget.value) || 0
          });

          if (res.ok) {
            Common.showAlert('profileAlert', 'Profile updated successfully!', 'success');
            API.setAuth(null, res.data.user);
            Common.populateUserHeader();
          } else {
            Common.showAlert('profileAlert', res.error || 'Failed to update profile.');
          }
        } catch (err) {
          Common.showAlert('profileAlert', 'Network error while updating profile.');
        } finally {
          btn.disabled = false;
        }
      });

      // Change password
      passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        Common.clearAlert('passwordAlert');

        const oldPass = document.getElementById('oldPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmNewPassword').value;

        if (newPass !== confirmPass) {
          Common.showAlert('passwordAlert', 'New passwords do not match.');
          return;
        }

        const btn = document.getElementById('changePasswordBtn');
        btn.disabled = true;

        try {
          const res = await API.post(CONFIG.ENDPOINTS.CHANGE_PASSWORD, {
            old_password: oldPass,
            new_password: newPass,
            confirm_new_password: confirmPass
          });

          if (res.ok) {
            Common.showAlert('passwordAlert', 'Password changed successfully!', 'success');
            passwordForm.reset();
            if (res.data.token) {
              API.setAuth(res.data.token, null);
            }
          } else {
            Common.showAlert('passwordAlert', res.error || 'Failed to change password.');
          }
        } catch (err) {
          Common.showAlert('passwordAlert', 'Network error while changing password.');
        } finally {
          btn.disabled = false;
        }
      });
    });

    // Responsive sidebar toggle
    const toggleBtn = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('appSidebar');
    const backdrop = document.getElementById('sidebarBackdrop');

    if (toggleBtn && sidebar && backdrop) {
      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('show');
        backdrop.classList.toggle('show');
      });
      backdrop.addEventListener('click', () => {
        sidebar.classList.remove('show');
        backdrop.classList.remove('show');
      });
    }
  </script>
</body>
</html>
