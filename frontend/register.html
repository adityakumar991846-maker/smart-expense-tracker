<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/auth.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="/frontend/register.html" class="auth-brand">
        <i class="bi bi-wallet2"></i>
        <span>Smart Expense</span>
      </a>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Start tracking your expenses and OCR receipts</p>

      <div id="registerAlert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="fullName" class="form-label fw-medium">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="fullName" placeholder="Aditya Kumar" required autocomplete="name">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-medium">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control border-start-0" id="email" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-medium">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control border-start-0" id="password" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label fw-medium">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-shield-check"></i>
            </span>
            <input type="password" class="form-control border-start-0" id="confirmPassword" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 mt-2">
          Create Account
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p class="text-center mb-0 small text-muted">
        Already have an account?
        <a href="/frontend/login.html" class="fw-semibold text-primary text-decoration-none">Sign In</a>
      </p>
    </div>
  </div>

  <script src="/frontend/js/config.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/common.js"></script>
  <script src="/frontend/js/register.js"></script>
</body>
</html>
