services:
  - type: web
    name: smart-expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /admin/login/
    disk:
      name: smart-expense-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DB_ENGINE
        value: django.db.backends.mysql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL_CA
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract

  - type: web
    name: smart-expense-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: node build-config.mjs
    staticPublishPath: ./deploy-dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        sync: false
